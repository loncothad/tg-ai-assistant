[package]
name = "teleforge"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Production multi-tenant Telegram AI assistant for OpenRouter and AI Hub"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.23"
chacha20poly1305 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
eyre = "0.6"
frankenstein = { version = "0.50.2", features = ["client-reqwest"] }
hmac = "0.13"
hex = "0.4"
rand = "0.10"
redb = "4.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3.20"
sha2 = "0.11"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "sync"] }
tower-http = { version = "0.7", features = ["catch-panic", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
tikv-jemallocator = "0.7"

[profile.release]
lto = "thin"
strip = true
