services:
  teleforge:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TELEFORGE_CONFIG: /app/config.yaml
    volumes:
      # Z gives the bind-mounted file a private SELinux container label on
      # enforcing RHEL-family hosts such as AlmaLinux.
      - ./config.yaml:/app/config.yaml:ro,Z
      - teleforge-data:/app/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "teleforge", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  teleforge-data:
