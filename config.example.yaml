# Environment expressions use a NAME placeholder or NAME:-default syntax. The process does not
# load .env files itself; export variables or use your service manager/Compose.
server:
  listen: "${TELEFORGE_LISTEN:-0.0.0.0:8080}"
  # Public HTTPS origin used by Telegram to open the authenticated Mini App.
  public_url: "${TELEFORGE_PUBLIC_URL}"
  request_timeout_seconds: 180
  # Limits CPU/memory spikes if Telegram delivers a burst of updates.
  max_concurrent_requests_per_bot: 4
  admin_init_data_ttl_seconds: 900
  max_input_media_bytes: 20971520
  json_logs: true

database:
  # Local filesystem only. Back up this file and never share it between processes.
  path: "${TELEFORGE_DATABASE_PATH:-data/teleforge.redb}"
  # Generate once with: openssl rand -base64 32
  encryption_key: "${TELEFORGE_MASTER_KEY}"
  history_limit: 30

telegram:
  # Tokens are assigned to enabled bot entries below in the same order.
  tokens: "${TELEGRAM_BOT_TOKENS}"

# AI Hub is an independent OpenAI-compatible model provider. Its live model
# list is loaded from /v1/models and is kept separate from OpenRouter in the UI.
aihub:
  bootstrap_api_key: "${AIHUB_API_KEY:-}"
  base_url: "${AIHUB_BASE_URL:-https://aihub.top/v1}"
  defaults:
    max_completion_tokens: null
    temperature: null
    tools: []
    extra: {}

# fal.ai models, capability categories, pricing, and OpenAPI schemas are
# discovered from the Platform API. Entries below are optional overrides for
# private or unusual endpoints whose schema needs an explicit mapping.
fal:
  bootstrap_api_key: "${FAL_KEY:-}"
  catalog_url: "${FAL_CATALOG_URL:-https://api.fal.ai/v1}"
  base_url: "https://queue.fal.run"
  poll_interval_seconds: 2
  timeout_seconds: 900
  endpoints:
    # This override demonstrates the complete mapping format. It takes
    # precedence over the live OpenAPI schema for the same endpoint ID.
    - id: "fal-ai/flux/schnell"
      # Override with https://fal.run for a direct call; queue.fal.run is recommended.
      base_url: null
      name: "FLUX Schnell (fal.ai)"
      description: "Fast text-to-image generation through fal.ai."
      capabilities: ["text_to_image"]
      prompt_field: "prompt"
      image_field: null
      width_field: "image_size.width"
      height_field: "image_size.height"
      aspect_ratio_field: null
      output_url_paths: ["/images/0/url"]
      output_text_paths: []
      defaults:
        num_images: 1
        enable_safety_checker: true
      created: null
    # Endpoint schemas vary. Example mappings for other capability types:
    # - id: "fal-ai/your-video-endpoint"
    #   base_url: null
    #   name: "Configured video endpoint"
    #   capabilities: ["video_generation"]
    #   prompt_field: "prompt"
    #   image_field: "image_url"
    #   output_url_paths: ["/video/url"]
    #   output_text_paths: []
    #   defaults: {}
    #   created: null
    # Vision endpoints return text/JSON and must explicitly declare the kind of
    # understanding they provide. A classifier such as an NSFW detector should
    # only be selected if that narrow output is what the bot administrator wants.
    # - id: "fal-ai/x-ailab/nsfw"
    #   base_url: null
    #   name: "NSFW image classifier"
    #   description: "Schema-configured fal.ai vision endpoint."
    #   capabilities: ["image_understanding"]
    #   prompt_field: ""
    #   image_field: "image_urls"
    #   output_url_paths: []
    #   output_text_paths: ["/has_nsfw_concepts"]
    #   defaults: {}
    #   created: null
    # Specialized generation capability names are: text_to_image,
    # image_to_image, text_to_video, image_to_video, video_to_video,
    # text_to_audio, video_to_audio, text_to_speech, text_to_3d, image_to_3d,
    # text_to_image_vector, and image_to_image_vector. Vector endpoints must
    # return SVG; Teleforge wraps it in a standalone HTML document.
    # Optional Hunyuan3D v3 overrides. These are normally discovered
    # automatically; uncomment only to pin explicit field/output mappings:
    # - id: "fal-ai/hunyuan3d-v3/text-to-3d"
    #   base_url: null
    #   name: "Hunyuan3D v3 · Text to 3D"
    #   description: "Official fal.ai text-to-3D endpoint."
    #   capabilities: ["text_to_3d"]
    #   prompt_field: "prompt"
    #   image_field: null
    #   output_url_paths: ["/model_glb/url", "/model_urls/glb/url"]
    #   output_text_paths: []
    #   defaults: {}
    #   created: null
    # - id: "fal-ai/hunyuan3d-v3/image-to-3d"
    #   base_url: null
    #   name: "Hunyuan3D v3 · Image to 3D"
    #   description: "Official fal.ai image-to-3D endpoint."
    #   capabilities: ["image_to_3d"]
    #   prompt_field: ""
    #   image_field: "input_image_url"
    #   output_url_paths: ["/model_glb/url", "/model_urls/glb/url"]
    #   output_text_paths: []
    #   defaults: {}
    #   created: null
    # - id: "fal-ai/your-transcription-endpoint"
    #   base_url: null
    #   name: "Configured transcription endpoint"
    #   capabilities: ["transcription"]
    #   prompt_field: ""
    #   audio_field: "audio_url"
    #   language_field: "language"
    #   output_url_paths: []
    #   output_text_paths: ["/text"]
    #   defaults: {}
    #   created: null

openrouter:
  # Optional bootstrap value. On first start it is encrypted separately for every
  # bot; administrators can then replace/remove it in the Mini App.
  bootstrap_api_key: "${OPENROUTER_API_KEY:-}"
  base_url: "https://openrouter.ai/api/v1"
  site_url: "${OPENROUTER_SITE_URL:-https://example.com}"
  app_name: "Teleforge Telegram Assistant"

  # Current OpenRouter server-tool search (not the deprecated web plugin/:online).
  web_search:
    engine: "auto" # auto, native, exa, firecrawl, parallel, or perplexity
    # Exa: instant/fast/auto/deep-lite/deep/deep-reasoning;
    # Parallel: turbo/basic/advanced. Omit for the engine default.
    mode: null
    max_results: 5
    max_uses: 5
    max_total_results: 15
    search_context_size: "medium" # low, medium, or high
    max_characters: null
    # Native-provider location bias; all fields are optional.
    user_location: null # {type: approximate, city: Istanbul, country: TR, timezone: Europe/Istanbul}
    allowed_domains: []
    excluded_domains: []
    extra: {}

  # Model-callable URL/PDF retrieval. This is independently toggleable per bot.
  web_fetch:
    engine: "auto" # auto, native, exa, openrouter, firecrawl, or parallel
    max_uses: 5
    max_content_tokens: 50000
    allowed_domains: []
    blocked_domains: []
    extra: {}

  # Startup defaults and optional per-model overrides. The admin chooser loads all
  # compatible models from OpenRouter's live catalog, so this is not an allowlist.
  models:
    - id: "openrouter/auto"
      label: "OpenRouter Auto"
      options:
        models: []
        provider:
          allow_fallbacks: true
          data_collection: "allow"
          # Keep this false when models are selected from the live catalog.
          # OpenRouter can otherwise reject every endpoint when a model does
          # not implement an optional default such as parallel_tool_calls.
          require_parameters: false
        plugins: []
        transforms: []
        reasoning:
          effort: "medium"
        response_format: null
        modalities: ["text"]
        temperature: 0.4
        top_p: 0.95
        top_k: null
        max_tokens: 4096
        frequency_penalty: 0.0
        presence_penalty: 0.0
        seed: null
        stop: null
        logprobs: false
        top_logprobs: null
        user: null
        # Forward-compatible OpenRouter request fields are merged unchanged.
        extra:
          usage:
            include: true
    - id: "anthropic/claude-sonnet-4.5"
      label: "Claude Sonnet"
      options:
        provider:
          allow_fallbacks: true
          data_collection: "allow"

  understanding:
    image:
      default_model: "google/gemini-2.5-flash"
      models:
        - id: "google/gemini-2.5-flash"
          label: "Gemini 2.5 Flash Vision"
          options:
            max_tokens: 4096
    video:
      default_model: "google/gemini-2.5-flash"
      models:
        - id: "google/gemini-2.5-flash"
          label: "Gemini 2.5 Flash Video"
          options:
            max_tokens: 4096

  # Applied first; the selected model's options override these fields.
  # A separate bounded call classifies natural-language requests. openrouter/free
  # filters its zero-cost pool for structured-output support automatically.
  planner:
    model: "openrouter/free"
    # Used only if the free router produces no valid final structured output.
    fallback_model: "google/gemini-2.5-flash-lite"
    max_tokens: 1200
    timeout_seconds: 20

  defaults:
    models: []
    provider:
      allow_fallbacks: true
      # OpenRouter's default. Set true only when every selected model/provider
      # supports every optional request parameter configured below.
      require_parameters: false
      data_collection: "allow"
      zdr: false
      # Also supported: order, only, ignore, quantizations, sort,
      # enforce_distillable_text, preferred_min_throughput,
      # preferred_max_latency, and max_price. Runtime panel routing is merged last.
    plugins: []
    transforms: []
    reasoning: null
    reasoning_effort: null
    response_format: null
    tools: [] # OpenRouter server tools may be listed here; local tools are appended.
    tool_choice: null
    parallel_tool_calls: true
    cache_control: null
    image_config: null
    logit_bias: null
    max_completion_tokens: null
    max_tool_calls: 12 # Shared budget across OpenRouter server tools; maximum 30.
    metadata: null
    min_p: null
    repetition_penalty: null
    route: null
    service_tier: null
    stop_server_tools_when: null
    top_a: null
    trace: null
    modalities: ["text"]
    temperature: null
    top_p: null
    top_k: null
    max_tokens: 4096
    frequency_penalty: null
    presence_penalty: null
    seed: null
    stop: null
    logprobs: null
    top_logprobs: null
    user: null
    extra: {}

  image:
    model: "bytedance-seed/seedream-4.5"
    models:
      - id: "bytedance-seed/seedream-4.5"
        label: "Seedream 4.5"
        extra: {}
      - id: "openai/gpt-image-1"
        label: "GPT Image 1"
        extra:
          quality: "high"
    # Size is intentionally omitted: explicit prompt geometry or reference-media
    # geometry is used; otherwise the selected provider chooses its native best.
    extra:
      n: 1

  audio:
    model: "openai/gpt-4o-mini-tts-2025-12-15"
    models:
      - id: "openai/gpt-4o-mini-tts-2025-12-15"
        label: "GPT-4o Mini TTS"
        extra: {}
    voice: "nova"
    response_format: "mp3"
    speed: 1.0
    extra: {}

  # Music/non-speech audio uses OpenRouter chat completions with streamed audio.
  music:
    model: "google/lyria-3-clip-preview"
    models:
      - id: "google/lyria-3-clip-preview"
        label: "Google Lyria 3 Clip Preview"
        extra: {}
      - id: "google/lyria-3-pro-preview"
        label: "Google Lyria 3 Pro Preview"
        extra: {}
      - id: "openai/gpt-audio-mini"
        label: "OpenAI GPT Audio Mini"
        extra:
          audio:
            voice: "alloy"
            format: "mp3"
    format: "mp3"
    # Used for providers that accept a named voice. OpenAI defaults to alloy.
    voice: null
    extra: {}

  transcription:
    model: "openai/whisper-large-v3"
    models:
      - id: "openai/whisper-large-v3"
        label: "Whisper Large v3"
        extra: {}
    language: null
    temperature: null
    extra: {}

  video:
    model: "google/veo-3.1"
    models:
      - id: "google/veo-3.1"
        label: "Veo 3.1"
        extra: {}
    duration: 8
    # aspect_ratio/resolution are intentionally omitted for the same reason.
    poll_interval_seconds: 15
    timeout_seconds: 600
    generate_audio: false
    extra: {}

search:
  default_provider: openrouter
  max_results: 8
  brave:
    bootstrap_api_key: "${BRAVE_SEARCH_API_KEY:-}"
    base_url: "https://api.search.brave.com/res/v1/web/search"
    options:
      safesearch: "moderate"
  exa:
    bootstrap_api_key: "${EXA_API_KEY:-}"
    base_url: "https://api.exa.ai/search"
    options:
      type: "auto"
  serpapi:
    bootstrap_api_key: "${SERPAPI_API_KEY:-}"
    base_url: "https://serpapi.com/search.json"
    options:
      hl: "en"
      safe: "active"

# This is an arbitrary-length list, not a fixed pair. Add one block per token in
# TELEGRAM_BOT_TOKENS, keeping the same order. Disabled entries consume no token.
# Every bot ID has independent settings, credentials, history, allowlist, and offset.
bots:
  - id: "primary"
    enabled: true
    default_model: "openrouter/auto"
    # Immutable administrators; the Web App rejects everyone else server-side.
    admin_user_ids: [123456789]
    # Initial mutable answer allowlist. Later admin edits survive restarts.
    allowed_user_ids: [123456789]
    allowed_chat_ids: []
    access:
      private_messages: true
      group_chats: true
      guest_messages: true
      require_mention_in_groups: true
      allow_everyone: false

  # Duplicate this block for a second, third, or hundredth independent bot.
  - id: "team"
    enabled: true
    default_model: "anthropic/claude-sonnet-4.5"
    admin_user_ids: [123456789]
    allowed_user_ids: []
    allowed_chat_ids: [-1001234567890]
    access:
      private_messages: true
      group_chats: true
      guest_messages: false
      require_mention_in_groups: true
      allow_everyone: false
